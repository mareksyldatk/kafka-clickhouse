controller:
  replicaCount: 3
  controllerOnly: true

broker:
  replicaCount: 3
  config:
    default.replication.factor: 3
    offsets.topic.replication.factor: 3
    transaction.state.log.replication.factor: 3
    transaction.state.log.min.isr: 2
    min.insync.replicas: 2
  extraVolumes:
    - name: kafka-client-config
      secret:
        secretName: kafka-secrets
  extraVolumeMounts:
    - name: kafka-client-config
      mountPath: /opt/bitnami/kafka/config/k8s-secrets
      readOnly: true

sasl:
  enabledMechanisms: PLAIN
  interBrokerMechanism: PLAIN
  controllerMechanism: PLAIN
  interbroker:
    user: broker
  controller:
    user: broker
  client:
    users:
      - schema_registry
      - client
  existingSecret: kafka-secrets

externalAccess:
  enabled: true
  broker:
    service:
      type: NodePort
      ports:
        external: 9095
      nodePorts:
        - 30092
        - 30093
        - 30094
      domain: "127.0.0.1"

provisioning:
  replicationFactor: 3
